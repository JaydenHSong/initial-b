<!doctype html>

<title>initial-B — iBD 바이브 코딩</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2b333d; --text:#e9edf1; --dim:#8a95a1; --green:#5fd4a2; }
  * { box-sizing:border-box; margin:0; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  body { background:var(--bg); color:var(--text); font-family:"Pretendard Variable",sans-serif; min-height:100vh; }
  .mono { font-family:"IBM Plex Mono",monospace; }
  header {
    text-align:center; padding:46px 24px 0;
    position:sticky; top:0; z-index:20; background:rgba(16,20,24,.94);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
  }
  /* 스크롤하면 한 줄 바로 접힌다 — 카드가 아무리 쌓여도 드랍창은 항상 떠 있다 */
  header.compact { padding:12px 24px 0; }
  header.compact .eyebrow, header.compact .sub { display:none; }
  header.compact h1 { font-size:20px; margin:0 0 10px; }
  header.compact form { margin-top:0; }
  header.compact input { padding:8px 13px; }
  header.compact button { padding:8px 16px; }
  .eyebrow { font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.3em; color:var(--dim); }
  h1 { font-size:46px; font-weight:800; letter-spacing:-.02em; margin:10px 0 8px; }
  h1 .b { color:var(--green); }
  .sub { color:var(--dim); font-size:14.5px; }
  .sub b { color:var(--text); font-weight:600; }
  form { display:flex; gap:8px; max-width:520px; margin:24px auto 0; padding:0 16px; }
  input { flex:1; padding:12px 15px; border-radius:10px; border:1px solid var(--line); background:var(--panel);
    color:var(--text); font-size:14px; outline:none; font-family:inherit; }
  input:focus { border-color:var(--green); }
  button { padding:12px 22px; border-radius:10px; border:0; background:var(--green); color:#0c1310;
    font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap; }
  button:disabled { opacity:.5; cursor:wait; }
  #msg { text-align:center; font-size:13px; color:var(--dim); min-height:1.4em; margin-top:10px; }
  #msg.err { color:#ff8f8f; }
  /* 선택지가 늘어나도 고정 헤더는 한 줄 높이를 유지한다 */
  nav {
    padding:10px 16px 14px; max-width:720px; margin:auto;
    display:flex; gap:12px; justify-content:center; align-items:end;
  }
  .filter-field {
    display:flex; flex-direction:column; gap:5px; min-width:0; text-align:left;
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em; color:var(--dim);
  }
  .week-field { width:180px; }
  .who-field { width:150px; }
  .stack-field { flex:1; max-width:330px; }
  nav select {
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    padding:9px 30px 9px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); cursor:pointer; width:100%; height:36px;
    appearance:none; text-overflow:ellipsis;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 17px) 16px, calc(100% - 13px) 16px;
    background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
  }
  nav select:hover, nav select:focus-visible { border-color:var(--green); outline:none; }
  nav select option { background:var(--panel); color:var(--text); font-weight:400; }
  /* 타임라인 */
  main { max-width:980px; margin:36px auto 90px; position:relative; padding:0 24px; }
  main::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:2px;
    background:linear-gradient(var(--green), var(--line)); transform:translateX(-50%); }
  .node { position:relative; text-align:center; margin:34px 0 22px; scroll-margin-top:215px; }
  .node .dot { display:inline-grid; place-items:center; width:64px; height:64px; border-radius:50%;
    background:var(--bg); border:2px solid var(--green); font-family:"IBM Plex Mono",monospace;
    font-weight:600; font-size:15px; color:var(--green); position:relative; z-index:1; }
  .node .label, .next .label { display:table; margin:8px auto 0; font-family:"IBM Plex Mono",monospace;
    font-size:11px; color:var(--dim); letter-spacing:.14em; background:var(--bg); padding:2px 12px;
    position:relative; z-index:1; text-decoration:none; }
  a.label:hover { color:var(--green); }
  .entry {
    width:calc(50% - 44px); background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; position:relative; margin-bottom:20px; transition:border-color .15s;
  }
  .entry:hover { border-color:var(--green); }
  .entry.l { margin-right:auto; } .entry.r { margin-left:auto; }
  .entry::after { content:""; position:absolute; top:26px; width:44px; height:2px; background:var(--line); }
  .entry.l::after { right:-44px; } .entry.r::after { left:-44px; }
  .shot { aspect-ratio:16/9; background:linear-gradient(135deg,#1e252e,#232f3a);
    background-size:cover; background-position:top center; border-bottom:1px solid var(--line); }
  .entry .body { padding:18px 20px; }
  .entry h2 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .who { color:var(--dim); font-size:12.5px; margin:4px 0 10px; }
  .opt { display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
    background:rgba(95,212,162,.12); color:var(--green); padding:2px 9px; border-radius:999px; margin-bottom:8px; }
  .opt.none { background:rgba(138,149,161,.12); color:var(--dim); font-weight:400; }
  .entry p { font-size:13px; color:var(--dim); line-height:1.55; min-height:2.5em; }
  .docs { margin-top:10px; font-size:12px; }
  .docs a { color:var(--dim); text-decoration:none; margin-right:12px; }
  .docs a:hover { color:var(--green); }
  .next { text-align:center; position:relative; margin-top:8px; }
  .next .dot { display:inline-grid; place-items:center; width:52px; height:52px; border-radius:50%;
    background:var(--bg); border:2px dashed var(--line); font-family:"IBM Plex Mono",monospace;
    font-size:12px; color:var(--dim); position:relative; z-index:1; }
  .state { color:var(--dim); font-size:15px; padding:56px 0; text-align:center; position:relative; z-index:1;
    background:var(--bg); }
  footer {
    border-top:1px solid var(--line); padding:28px 24px 36px; text-align:center;
    font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--dim); line-height:2;
  }
  footer a { color:var(--dim); text-decoration:none; margin:0 10px; }
  footer a:hover { color:var(--green); }
  footer .copy { display:block; font-size:11.5px; opacity:.75; }
  .entry:focus-visible { outline:2px solid var(--green); outline-offset:3px; border-color:var(--green); }
  @media (max-width:760px) {
    /* 첫 화면의 3분의 1을 헤더가 먹지 않게 — 스크롤 전에도 카드가 보여야 한다 */
    header { padding:22px 20px 0; }
    h1 { font-size:32px; margin:6px 0 6px; }
    .eyebrow { font-size:10.5px; letter-spacing:.24em; }
    .sub { font-size:13px; }
    form { margin-top:16px; }
    /* 좁은 화면에서도 필터 세 개를 한 줄에 유지한다 */
    nav {
      padding:10px 16px 14px; display:grid; grid-template-columns:.9fr 1fr 1.3fr;
      gap:8px; max-width:520px;
    }
    .week-field, .who-field, .stack-field { width:100%; max-width:none; }
    nav select { font-size:11px; padding-left:9px; }
    main { margin-top:24px; }
    main::before { left:28px; }
    .node { text-align:left; }
    .node .label { margin-left:0; }
    .entry { width:calc(100% - 74px); margin-left:74px !important; }
    .entry::after { left:-46px !important; right:auto; }
  }
  /* 시즌 아카이브 */
  header, header.compact {
    display:grid; grid-template-columns:minmax(150px,1fr) minmax(340px,560px);
    align-items:center; gap:0 24px; padding:16px max(24px,calc((100vw - 1440px)/2));
    text-align:left;
  }
  header .eyebrow, header .sub { display:none; }
  header h1, header.compact h1 { font-size:26px; margin:0; }
  header form, header.compact form { width:100%; max-width:none; margin:0; padding:0; }
  header input, header.compact input { padding:10px 13px; }
  header button, header.compact button { padding:10px 20px; }
  #msg { grid-column:1/-1; min-height:0; margin:0; }
  #msg:empty { display:none; }
  main, main.gallery { max-width:1440px; margin:0 auto 90px; padding:0; }
  main::before { display:none; }
  .archive-shell { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:75vh; }
  .milestones { border-right:1px solid var(--line); padding:28px 18px 40px 24px; }
  .milestones h2 { color:var(--dim); font:600 12px "IBM Plex Mono",monospace; letter-spacing:.08em; margin:0 0 18px; }
  .milestone-list { display:grid; gap:3px; }
  .milestone {
    display:flex; align-items:center; gap:11px; width:100%; padding:8px 10px;
    border:1px solid transparent; border-radius:9px; background:transparent;
    color:var(--dim); font:600 13px "IBM Plex Mono",monospace; text-align:left;
  }
  .milestone::before { content:""; width:9px; height:9px; flex:none; border:1px solid #52606b; border-radius:50%; }
  .milestone:hover, .milestone:focus-visible { color:var(--text); border-color:var(--line); outline:none; }
  .milestone.active { background:rgba(95,212,162,.12); color:var(--green); }
  .milestone.active::before { background:var(--green); border-color:var(--green); }
  .milestone .count { margin-left:auto; font-size:11px; color:var(--dim); }
  .archive-content { min-width:0; padding:28px clamp(24px,3vw,44px) 72px; scroll-margin-top:74px; }
  .mission { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:24px;
    padding:24px 30px; border:1px solid rgba(95,212,162,.7); border-radius:14px;
    background:rgba(18,59,49,.45); }
  .kicker { color:var(--green); font:600 12px "IBM Plex Mono",monospace; letter-spacing:.08em; }
  .mission h2 { font-size:clamp(25px,3vw,38px); line-height:1.18; margin:8px 0; }
  .mission .detail { font-size:15px; color:var(--text); }
  .mission .goal { color:var(--dim); font-size:14px; margin-top:8px; line-height:1.45; }
  .mission a, .empty a { display:inline-flex; align-items:center; justify-content:center; padding:11px 18px;
    border-radius:10px; background:var(--green); color:#0c1310; font-weight:800; text-decoration:none; white-space:nowrap; }
  .mission a:hover, .mission a:focus-visible, .empty a:hover { background:#8be7bf; outline:none; }
  .mission .linkhint { color:var(--dim); font-size:11px; text-align:center; margin-top:7px; }
  .week-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin:30px 0 18px; }
  .week-head h2 { font-size:25px; letter-spacing:-.02em; }
  .week-head p { color:var(--dim); font-size:14px; margin-top:5px; }
  .week-head a { color:var(--dim); font-size:13px; text-decoration:none; white-space:nowrap; }
  .week-head a:hover { color:var(--green); }
  .gallery-filters { display:flex; gap:10px; margin:0 0 20px; }
  .gallery-filters .filter-field { width:min(240px,50%); }
  .gallery-filters select { width:100%; height:36px; padding:7px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); color:var(--text); font:12px "IBM Plex Mono",monospace; }
  .gallery-filters select:focus-visible { outline:2px solid var(--green); }
  .project-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .project-grid.count-1 { grid-template-columns:minmax(0,1fr); }
  .project-grid.count-3, .project-grid.count-many { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .project-grid .entry, .previous-grid .entry { width:100%; margin:0 !important; background:var(--panel); }
  .project-grid .entry::after, .previous-grid .entry::after { display:none; }
  .project-grid.count-1 .entry { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr); }
  .project-grid.count-1 .shot { height:100%; min-height:300px; aspect-ratio:auto; border-bottom:0; border-right:1px solid var(--line); }
  .project-grid .entry .body { padding:16px 18px; }
  .project-grid:not(.count-1) .shot { aspect-ratio:2.4; }
  .project-grid:not(.count-1) .entry .body { padding:13px 16px; }
  .project-grid:not(.count-1) .who { margin:2px 0 5px; }
  .project-grid:not(.count-1) .opt { margin-bottom:4px; }
  .project-grid:not(.count-1) .entry p { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .project-grid:not(.count-1) .docs { margin-top:6px; }
  .project-grid.count-1 .entry .body { padding:28px; align-self:center; }
  .project-grid .entry h2 { font-size:17px; }
  .project-grid.count-1 .entry h2 { font-size:24px; }
  .project-grid .entry p { min-height:0; }
  .project-grid .shot, .previous-grid .shot { background:#1e252e; }
  .previous-week { margin-top:38px; padding-top:24px; border-top:1px solid var(--line); }
  .previous-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .previous-grid .entry .body { padding:12px 14px; }
  .previous-grid .entry h2 { font-size:15px; }
  .previous-grid .entry p, .previous-grid .docs, .previous-grid .opt { display:none; }
  .previous-grid .who { margin-bottom:0; }
  .empty { padding:36px; border:1px dashed var(--line); border-radius:12px; color:var(--dim); }
  .empty a { margin-top:16px; }
  @media (max-width:1000px) {
    .archive-shell { grid-template-columns:150px minmax(0,1fr); }
    .milestones { padding-left:12px; padding-right:10px; }
    .archive-content { padding:24px; }
    .project-grid.count-3, .project-grid.count-many { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .project-grid.count-1 .entry { grid-template-columns:1fr; }
    .project-grid.count-1 .shot { aspect-ratio:16/9; min-height:0; border-right:0; border-bottom:1px solid var(--line); }
  }
  @media (max-width:700px) {
    header, header.compact { grid-template-columns:1fr; gap:10px; padding:14px 16px; }
    header h1, header.compact h1 { font-size:23px; }
    .archive-shell { display:block; }
    .milestones { padding:12px 16px; border-right:0; border-bottom:1px solid var(--line); scroll-margin-top:106px; }
    .milestones h2 { margin-bottom:8px; }
    .milestone-list { display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; }
    .milestone-list::-webkit-scrollbar { display:none; }
    .milestone { width:auto; flex:none; padding:8px 11px; }
    .milestone .count { margin-left:2px; }
    .archive-content { padding:20px 16px 50px; }
    .mission { display:block; padding:20px; }
    .mission h2 { font-size:27px; }
    .mission .action { margin-top:18px; }
    .week-head { display:block; }
    .week-head a { display:inline-block; margin-top:8px; }
    .project-grid, .project-grid.count-3, .project-grid.count-many, .previous-grid { grid-template-columns:1fr; }
    .project-grid.count-1 .entry .body { padding:18px; }
  }
</style>
<header>

<script>
const SUPA = 'https://mathlgugjqnnhsexvqjy.supabase.co';
const KEY = 'sb_publishable_ZYCrRbAghMXoB_dUKG1X1g_TkhCDJYA'; // 읽기 전용 공개 키
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let ALL = [];          // 전체 레코드
let FILTER = null;     // 선택된 스택 옵션
let WHO = null;        // 선택된 만든 사람
let SELECTED_WEEK = null;

// 시즌 로드맵 — guide.html 달력과 같은 데이터. [id, 시작일(월), 날짜 라벨, 주제, 스택 카드]
const ROAD = [
  ['S01','2026-08-03','AUG 3—7','팀 갤러리 구축','배포/호스팅'],
  ['S02','2026-08-10','AUG 10—14','ASIN 스크랩북','데이터 저장'],
  ['S03','2026-08-17','AUG 17—21','팀 아이디어 보드','인증'],
  ['S04','2026-08-24','AUG 24—28','경쟁사 가격 수집기','크롤링'],
  ['S05','2026-08-31','AUG 31—9/4','제품 카탈로그','Postgres 심화'],
  ['S06','2026-09-08','SEP 8—11','리뷰 분석기','Claude 호출 경로'],
  ['S07','2026-09-14','SEP 14—18','영수증 정리기','스토리지 + OCR'],
  ['S08','2026-09-21','SEP 21—25','실시간 재고 보드','실시간'],
  ['S09','2026-10-05','OCT 5—9','컬러 트렌드 무드보드','이미지 색 추출'],
  ['S10','2026-10-12','OCT 12—16','사내 지식 검색','검색'],
  ['S11','2026-10-19','OCT 19—23','CS 문의 트리아지','큐/웹훅'],
  ['S12','2026-10-26','OCT 26—30','알림 허브','알림 채널'],
  ['S13','2026-11-02','NOV 2—6','제품 매뉴얼 Q&A','벡터DB + RAG'],
  ['S14','2026-11-09','NOV 9—13','KPI 대시보드','시각화/BI'],
  ['S15','2026-11-16','NOV 16—20','느린 화면 살리기','캐시/성능'],
  ['S16','2026-11-30','NOV 30—12/4','사용자 행동 추적','분석/관측'],
  ['S17','2026-12-07','DEC 7—11','같은 앱, 두 스택','Postgres vs Firebase'],
  ['S18','2026-12-14','DEC 14—18','리메이크','시즌 파이널'],
];
const roadOf = k => ROAD.find(r => r[0] === k);
const missionUrl = k => `/guide.html#${k.toLowerCase()}`;
const localDateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// 좁은 화면에서는 안내 문구가 잘리므로 짧은 쪽으로 바꾼다
const narrow = matchMedia('(max-width:480px)');
const setPlaceholder = () =>
  $('url').placeholder = narrow.matches ? '배포 URL 붙여넣고 엔터' : '배포 URL을 붙여넣고 엔터 — 그게 제출이다';
setPlaceholder();
narrow.addEventListener('change', setPlaceholder);

// 스크롤하면 헤더가 한 줄 바로 접힌다
addEventListener('scroll', () =>
  document.querySelector('header').classList.toggle('compact', scrollY > 40), { passive: true });

// FLIP: 필터·갱신으로 카드가 재배치될 때 제자리에서 미끄러져 이동한다
function animatedRender() {
  const old = new Map([...document.querySelectorAll('.entry')].map(el => [el.dataset.url, el.getBoundingClientRect()]));
  render();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.entry').forEach((el, i) => {
    const prev = old.get(el.dataset.url);
    if (prev) {
      const now = el.getBoundingClientRect();
      const dx = prev.left - now.left, dy = prev.top - now.top;
      if (dx || dy) el.animate(
        [{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }],
        { duration: 350, easing: 'cubic-bezier(.2,.8,.2,1)' });
    } else {
      el.animate(
        [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }],
        { duration: 300, delay: Math.min(i * 45, 400), easing: 'ease-out', fill: 'backwards' });
    }
  });
}

// 다음 목요일 18:00 (KST) 제출 마감까지 D-n
function dday() {
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  const d = new Date(now);
  const add = (4 - d.getDay() + 7) % 7; // 4 = 목
  d.setDate(d.getDate() + add); d.setHours(18, 0, 0, 0);
  if (d <= now) d.setDate(d.getDate() + 7);
  return Math.ceil((d - now) / 86400000);
}

function entry(r) {
  const title = r.title || new URL(r.url).hostname;
  const badge = r.stack_option
    ? `<span class="opt">${esc(r.stack_option)}</span>`
    : `<span class="opt none">기획서 없음</span>`;
  // 썸네일은 배경 이미지라 스크린리더가 못 읽는다 — role/aria-label로 읽히게 한다
  const shot = r.shot_url
    ? `<div class="shot" role="img" aria-label="${esc(title)} 스크린샷" style="background-image:url('${esc(r.shot_url)}')"></div>`
    : `<div class="shot"></div>`;
  // div 카드라 Tab이 안 닿는다 — role/tabindex를 주고 Enter·Space로도 열리게 한다
  return `<div class="entry" data-url="${esc(r.url)}"
      role="link" tabindex="0" aria-label="${esc(title)} 사이트 열기">
    ${shot}
    <div class="body">
      <h2>${esc(title)}</h2>
      <div class="who">${esc(r.author || '만든 사람 미상')}</div>
      ${badge}
      ${r.intro ? `<p>${esc(r.intro)}</p>` : ''}
      <div class="doclinks docs">
        <a href="${esc(r.url)}/docs/plan.html" target="_blank" rel="noopener">기획서 ↗</a>
        <a href="${esc(r.url)}/docs/report.html" target="_blank" rel="noopener">리포트 ↗</a>
        ${r.repo ? `<a href="${esc(r.repo)}" target="_blank" rel="noopener">소스 ↗</a>` : ''}
      </div>
    </div>
  </div>`;
}

function render() {
  $('tagline').innerHTML =
    `시작이 모이는 곳 — <b>${ALL.length}개의 시작</b> · 목 18:00 마감 <b>D-${dday()}</b>`;
  const today = localDateKey(new Date());
  const next = ROAD.find(r => r[1] > today);
  const selected = roadOf(SELECTED_WEEK) || ROAD[0];
  const selectedIndex = ROAD.indexOf(selected);
  const rows = ALL.filter(r => r.sprint === selected[0] &&
    (!FILTER || r.stack_option === FILTER) && (!WHO || r.author === WHO));
  const totalForWeek = ALL.filter(r => r.sprint === selected[0]).length;
  const opts = [...new Set(ALL.map(r => r.stack_option).filter(Boolean))];
  const whos = [...new Set(ALL.map(r => r.author).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
  const filters = `<div class="gallery-filters">
    <label class="filter-field"><span>사람</span><select id="who-filter" aria-label="사람 필터">
      <option value="">전체</option>${whos.map(w => `<option value="${esc(w)}"${WHO === w ? ' selected' : ''}>${esc(w)}</option>`).join('')}
    </select></label>` +
    `<label class="filter-field"><span>스택</span><select id="stack-filter" aria-label="스택 필터">
      <option value="">전체</option>${opts.map(o => `<option value="${esc(o)}"${FILTER === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}
    </select></label></div>`;
  const mission = next ? `<section class="mission" aria-label="다음 주 미션">
      <div><span class="kicker">다음 주 미션</span><h2>${next[0]} · ${esc(next[3])}</h2>
        <p class="detail">${next[0] === 'S09' ? '10월 5–9일' : esc(next[2])} · ${esc(next[4])}</p>
        ${next[0] === 'S09' ? '<p class="goal">이미지에서 대표색 5개를 뽑아 팔레트로 저장하고 HEX 코드를 복사한다.</p>' : ''}
      </div><div class="action"><a href="${missionUrl(next[0])}">${next[0]} 미션 보기 ↗</a>
        <p class="linkhint">시즌 가이드 · ${next[0]}</p></div>
    </section>` : '';
  const sidebar = `<aside class="milestones" aria-label="18주 마일스톤"><h2>18주 아카이브</h2>
    <div class="milestone-list">${ROAD.map(r => {
      const count = ALL.filter(x => x.sprint === r[0]).length;
      return `<button type="button" class="milestone${selected[0] === r[0] ? ' active' : ''}" data-week="${r[0]}"
        aria-pressed="${selected[0] === r[0]}" aria-label="${r[0]} ${esc(r[3])} 제출작 ${count}개" title="${esc(r[3])}">${r[0]}<span class="count">${next?.[0] === r[0] ? '다음 주' : count || ''}</span></button>`;
    }).join('')}</div></aside>`;
  const gridClass = rows.length === 1 ? 'count-1' : rows.length === 3 ? 'count-3' : rows.length > 4 ? 'count-many' : '';
  const projects = rows.length
    ? `<div class="project-grid ${gridClass}">${rows.map(entry).join('')}</div>`
    : `<div class="empty">${totalForWeek ? '이 조건에 맞는 제출작이 없습니다.' : '아직 이 주차에 올라온 사이트가 없습니다.'}<br>
        <a href="${missionUrl(selected[0])}">${selected[0]} 미션 보기 ↗</a></div>`;
  const previous = selectedIndex > 0 ? ROAD[selectedIndex - 1] : null;
  const previousRows = previous ? ALL.filter(r => r.sprint === previous[0]) : [];
  const previousSection = previousRows.length ? `<section class="previous-week">
    <div class="week-head"><div><span class="kicker">지난 주 둘러보기</span><h2>${previous[0]} · ${esc(previous[3])}</h2></div>
      <a href="#sp-${previous[0]}" data-week="${previous[0]}">${previous[0]} 전체 보기 ↗</a></div>
    <div class="previous-grid">${previousRows.slice(0,3).map(entry).join('')}</div></section>` : '';
  $('main').className = 'gallery';
  $('main').innerHTML = `<div class="archive-shell">${sidebar}<div class="archive-content">${mission}
    <section aria-labelledby="selected-title"><div class="week-head"><div><span class="kicker">${esc(selected[2])} · ${esc(selected[4])}</span>
      <h2 id="selected-title">${selected[0]} · ${esc(selected[3])} <span class="mono">${totalForWeek}개</span></h2>
      <p>같은 미션을 서로 다른 시선으로 만든 사이트입니다.</p></div>
      <a href="${missionUrl(selected[0])}">${selected[0]} 미션 보기 ↗</a></div>
      ${filters}${projects}</section>${previousSection}</div></div>`;
  const rail = document.querySelector('.milestone-list');
  const active = rail?.querySelector('.milestone.active');
  if (rail && active && matchMedia('(max-width:700px)').matches) {
    rail.scrollLeft = active.offsetLeft - rail.offsetLeft - (rail.clientWidth - active.clientWidth) / 2;
  }
}

async function load() {
  try {
    const r = await fetch(`${SUPA}/rest/v1/sites?select=*&order=created_at.asc`, {
      headers: { apikey: KEY, Authorization: `Bearer ${KEY}` },
    });
    if (!r.ok) throw new Error(r.status);
    ALL = await r.json();
    if (!SELECTED_WEEK) {
      const hashWeek = location.hash.match(/^#sp-(S\d\d)$/)?.[1];
      SELECTED_WEEK = roadOf(hashWeek) ? hashWeek : [...ALL].reverse().find(x => roadOf(x.sprint))?.sprint || ROAD[0][0];
    }
    animatedRender();
  } catch {
    $('main').innerHTML = '<div class="state">레지스트리를 못 읽었다. 잠시 뒤 새로고침하거나 관리자에게.</div>';
  }
}

$('dropform').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('go'), msg = $('msg');
  btn.disabled = true; msg.className = ''; msg.textContent = '스크린샷을 찍는 중… (10초쯤 걸린다)';
  try {
    // 캡처는 브라우저 쿼터로 — 실패해도 카드에는 지장 없음
    let shot_src = null;
    try {
      const cap = await fetch(`https://api.microlink.io/?url=${encodeURIComponent($('url').value)}&screenshot=true`);
      shot_src = (await cap.json())?.data?.screenshot?.url || null;
    } catch { /* 썸네일 없이 진행 */ }
    msg.textContent = '기획서를 읽는 중…';
    const r = await fetch('/api/drop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value, shot_src }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    msg.textContent = data.updated ? '이미 있던 URL — 카드를 새로 읽었다.' : '등록됐다.';
    $('url').value = '';
    SELECTED_WEEK = null;
    history.replaceState(null, '', location.pathname + location.search);
    load();
  } catch (err) {
    msg.className = 'err'; msg.textContent = '실패: ' + err.message;
  } finally { btn.disabled = false; }
});

document.addEventListener('click', e => {
  const week = e.target.closest('[data-week]');
  if (week) {
    e.preventDefault();
    SELECTED_WEEK = week.dataset.week;
    history.replaceState(null, '', `#sp-${SELECTED_WEEK}`);
    animatedRender();
    document.querySelector(matchMedia('(max-width:700px)').matches ? '.milestones' : '.archive-content')?.scrollIntoView({ block:'start' });
    return;
  }
  const card = e.target.closest('.entry');
  if (card && !e.target.closest('a')) window.open(card.dataset.url, '_blank', 'noopener');
});

// 필터는 선택된 주차의 제출작에만 적용한다.
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'who-filter' || id === 'stack-filter') {
    if (id === 'who-filter') WHO = e.target.value || null;
    else FILTER = e.target.value || null;
    animatedRender();
    $(id)?.focus();
  }
});

// 카드 위에서 Enter·Space로도 열린다 (마우스 없이 쓰는 사람용)
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest?.('.entry');
  if (!card) return;
  e.preventDefault();
  window.open(card.dataset.url, '_blank', 'noopener');
});

load();
</script>
</html>
