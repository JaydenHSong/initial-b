<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A · 인덱스 카드 — ASIN 스크랩북</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --paper:#f4efe4; --card:#fdfbf5; --ink:#2b2723; --dim:#8a8073; --line:#ddd4c2; --acc:#b4472f; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--paper); color:var(--ink); line-height:1.6; padding:0 18px 72px;
    font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
    background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% 32px; }
  .wrap { max-width:680px; margin:0 auto; }
  header { padding:34px 0 20px; }
  .k { font-size:11px; letter-spacing:.24em; color:var(--acc); font-weight:700; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:34px; font-weight:400;
    letter-spacing:-.01em; margin:6px 0 6px; }
  .lede { color:var(--dim); font-size:14.5px; max-width:34em; }
  .links { margin-top:12px; font-size:13px; }
  .links a { color:var(--dim); margin-right:14px; }

  form { background:var(--card); border:1px solid var(--line); border-radius:3px; padding:16px 18px;
    display:grid; gap:10px; grid-template-columns:1fr 1.3fr auto; align-items:center;
    box-shadow:2px 2px 0 var(--line); }
  input { font:inherit; font-size:14px; padding:9px 12px; border:0; border-bottom:1.5px solid var(--line);
    background:transparent; color:var(--ink); width:100%; border-radius:0; }
  input:focus { outline:0; border-bottom-color:var(--acc); }
  button { font:inherit; font-size:13.5px; font-weight:700; letter-spacing:.04em; padding:10px 20px;
    border:1.5px solid var(--ink); border-radius:3px; background:var(--ink); color:var(--card); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .msg { grid-column:1/-1; font-size:12.5px; color:var(--dim); }
  .msg.bad { color:var(--acc); }

  .chips { display:flex; flex-wrap:wrap; gap:7px; margin:26px 0 10px; }
  .chip { font-size:12.5px; letter-spacing:.02em; padding:4px 12px; border:1.5px solid var(--line);
    border-radius:2px; background:transparent; cursor:pointer; color:var(--dim); }
  .chip.on { border-color:var(--acc); color:var(--acc); font-weight:700;
    box-shadow:1.5px 1.5px 0 var(--acc); }
  .note { font-size:12px; color:var(--dim); font-style:italic; margin-bottom:16px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:16px 18px 15px 22px; margin-bottom:12px; position:relative; box-shadow:2px 2px 0 var(--line); }
  .card::before { content:""; position:absolute; left:12px; top:10px; bottom:10px; width:1.5px; background:var(--acc); opacity:.35; }
  .card h2 { font-family:Georgia,serif; font-size:16.5px; font-weight:400; line-height:1.45; margin-bottom:6px; }
  .card .meta { font-size:12.5px; color:var(--dim); letter-spacing:.03em; }
  .card .price { font-family:Georgia,serif; font-size:16px; color:var(--ink); }
  .card .tags { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .card .tags span { font-size:11.5px; letter-spacing:.04em; padding:2px 9px;
    border:1px solid var(--acc); color:var(--acc); border-radius:2px; }
  .fail { color:var(--acc); font-size:12px; }
  .empty { color:var(--dim); font-size:14px; padding:34px 0; text-align:center; font-style:italic; }
  @media (max-width:560px) { form { grid-template-columns:1fr; } h1 { font-size:27px; } }
</style>

<div class="wrap">
  <header>
    <div class="k">S02 · 데이터 저장</div>
    <h1>ASIN 스크랩북</h1>
    <div class="lede">아마존 ASIN을 등록하면 제목·가격을 채워 저장하고, <b>태그를 여러 개 골라 전부 달린 것만</b> 봅니다.</div>
    <div class="links"><a href="/docs/plan.html">기획서 ↗</a><a href="/docs/report.html">리포트 ↗</a><a href="/">현재 화면 ↗</a></div>
  </header>

  <form id="f">
    <input id="asin" placeholder="ASIN" maxlength="10" autocomplete="off" required>
    <input id="tags" placeholder="태그 쉼표로 — 방열, 5만원대" autocomplete="off" required>
    <button id="btn">등록</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, collection, getDocs, query, where }
  from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const db = getFirestore(initializeApp({
  apiKey: 'AIzaSyAYS4Os_XoJUyGRYBrN3Pmb5mDm4dox0b4',
  authDomain: 'initial-b.firebaseapp.com',
  projectId: 'initial-b',
  storageBucket: 'initial-b.firebasestorage.app',
  messagingSenderId: '678214115027',
  appId: '1:678214115027:web:c8fd3d32846d4c24483e26',
}));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const picked = new Set();
let allTags = [];

const row = (d) => `
  <div class="card">
    <h2>${d.title ? esc(d.title) : `<span class="fail">제목 수집 실패</span>`}</h2>
    <div class="meta">${d.asin}${d.price != null ? ` &nbsp;·&nbsp; <span class="price">$${d.price}</span>` : ''}${
      d.fetchOk === false ? ` &nbsp;·&nbsp; <span class="fail">${esc(d.fetchNote ?? '수집 실패')}</span>` : ''}</div>
    <div class="tags">${(d.tagNames ?? []).map((t) => `<span>${esc(t)}</span>`).join('')}</div>
  </div>`;

async function render() {
  const tags = [...picked];
  const q = tags.length
    ? query(collection(db, 'products'), where('tagNames', 'array-contains', tags[0]))
    : collection(db, 'products');
  let snap;
  try { snap = await getDocs(q); }
  catch (e) { $('list').innerHTML = `<div class="empty">읽기 실패 — ${esc(e.message)}</div>`; return; }

  const read = snap.size;
  const rows = snap.docs.map((d) => ({ asin: d.id, ...d.data() }))
    .filter((d) => tags.every((t) => (d.tagNames ?? []).includes(t)));

  if (!tags.length) {
    allTags = [...new Set(rows.flatMap((d) => d.tagNames ?? []))].sort();
    $('note').textContent = `제품 ${rows.length}개 · 문서 ${read}회 읽음`;
  } else {
    $('note').textContent = `태그 ${tags.length}개 AND — 서버가 ${read}개 돌려주고 ${rows.length}개가 정답 (${read - rows.length}개는 버렸지만 읽기 요금엔 포함된다)`;
  }
  $('chips').innerHTML = allTags.map((t) => `<div class="chip${picked.has(t) ? ' on' : ''}" data-t="${esc(t)}">${esc(t)}</div>`).join('');
  $('list').innerHTML = rows.length ? rows.map(row).join('')
    : `<div class="empty">${tags.length ? '이 태그를 모두 가진 제품이 없다' : '아직 등록된 제품이 없다'}</div>`;
}

$('chips').onclick = (e) => {
  const t = e.target.dataset.t; if (!t) return;
  picked.has(t) ? picked.delete(t) : picked.add(t);
  render();
};
$('f').onsubmit = async (e) => {
  e.preventDefault();
  $('btn').disabled = true; $('msg').className = 'msg';
  $('msg').textContent = '아마존에서 제목·가격을 가져오는 중…';
  try {
    const r = await fetch('/api/add', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ asin: $('asin').value, tags: $('tags').value.split(',') }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error ?? '등록 실패');
    $('msg').textContent = j.fetchOk ? `저장됨 — ${j.title ?? j.asin}` : `저장됨 (수집은 실패) — ${j.asin}`;
    $('asin').value = ''; $('tags').value = ''; picked.clear(); await render();
  } catch (err) { $('msg').className = 'msg bad'; $('msg').textContent = err.message; }
  $('btn').disabled = false;
};
render();
</script>
</html>
