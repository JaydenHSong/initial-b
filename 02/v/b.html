<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · 데이터 콘솔 — ASIN 스크랩북</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#262d36; --ink:#c9d1d9; --dim:#7d8590; --acc:#3fb950; --warn:#f85149; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); line-height:1.55; padding:0 16px 72px;
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace; font-size:13.5px; }
  .wrap { max-width:860px; margin:0 auto; }
  header { padding:28px 0 16px; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .k { font-size:11px; letter-spacing:.18em; color:var(--acc); }
  h1 { font-size:21px; font-weight:600; letter-spacing:-.01em; margin:6px 0 5px; }
  h1::before { content:"$ "; color:var(--acc); }
  .lede { color:var(--dim); font-size:13px; }
  .lede b { color:var(--ink); font-weight:600; }
  .links { margin-top:11px; font-size:12.5px; }
  .links a { color:var(--dim); margin-right:14px; }

  form { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px;
    display:grid; gap:8px; grid-template-columns:1fr 1.4fr auto; align-items:center; }
  input { font:inherit; font-size:13.5px; padding:8px 11px; border:1px solid var(--line);
    border-radius:5px; background:var(--bg); color:var(--ink); width:100%; }
  input::placeholder { color:#565f6b; }
  input:focus { outline:0; border-color:var(--acc); }
  button { font:inherit; font-size:13px; font-weight:600; padding:8px 18px; border:1px solid var(--acc);
    border-radius:5px; background:rgba(63,185,80,.12); color:var(--acc); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .msg { grid-column:1/-1; font-size:12.5px; color:var(--dim); }
  .msg::before { content:"› "; }
  .msg.bad { color:var(--warn); }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:22px 0 8px; }
  .chip { font-size:12.5px; padding:3px 10px; border:1px solid var(--line); border-radius:5px;
    background:var(--panel); color:var(--dim); cursor:pointer; }
  .chip::before { content:"["; } .chip::after { content:"]"; }
  .chip.on { border-color:var(--acc); color:var(--acc); background:rgba(63,185,80,.12); }
  .note { font-size:12px; color:var(--dim); margin-bottom:12px; padding-left:14px; text-indent:-14px; }
  .note::before { content:"› "; color:var(--acc); }

  .card { border:1px solid var(--line); border-left:2px solid var(--acc); border-radius:0 6px 6px 0;
    background:var(--panel); padding:11px 14px; margin-bottom:7px; }
  .card h2 { font-size:13.5px; font-weight:500; line-height:1.5; margin-bottom:5px; color:#e6edf3; }
  .card .meta { font-size:12px; color:var(--dim); }
  .card .price { color:var(--acc); font-weight:600; }
  .card .tags { margin-top:7px; display:flex; flex-wrap:wrap; gap:5px; }
  .card .tags span { font-size:11.5px; padding:1px 8px; border-radius:4px;
    background:var(--bg); border:1px solid var(--line); color:var(--dim); }
  .fail { color:var(--warn); font-size:12px; }
  .empty { color:var(--dim); font-size:13px; padding:30px 0; text-align:center; }
  @media (max-width:560px) { form { grid-template-columns:1fr; } }
</style>

<div class="wrap">
  <header>
    <div class="k">S02 · 데이터 저장 · FIRESTORE</div>
    <h1>ASIN 스크랩북</h1>
    <div class="lede">ASIN을 등록하면 제목·가격을 채워 저장하고, <b>태그를 여러 개 골라 전부 달린 것만</b> 봅니다.</div>
    <div class="links"><a href="/docs/plan.html">기획서 ↗</a><a href="/docs/report.html">리포트 ↗</a><a href="/">현재 화면 ↗</a></div>
  </header>

  <form id="f">
    <input id="asin" placeholder="ASIN" maxlength="10" autocomplete="off" required>
    <input id="tags" placeholder="태그 쉼표로 — 방열, 5만원대" autocomplete="off" required>
    <button id="btn">INSERT</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, collection, getDocs, query, where }
  from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const db = getFirestore(initializeApp({
  apiKey: 'AIzaSyAYS4Os_XoJUyGRYBrN3Pmb5mDm4dox0b4',
  authDomain: 'initial-b.firebaseapp.com',
  projectId: 'initial-b',
  storageBucket: 'initial-b.firebasestorage.app',
  messagingSenderId: '678214115027',
  appId: '1:678214115027:web:c8fd3d32846d4c24483e26',
}));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const picked = new Set();
let allTags = [];

const row = (d) => `
  <div class="card">
    <h2>${d.title ? esc(d.title) : `<span class="fail">제목 수집 실패</span>`}</h2>
    <div class="meta">${d.asin}${d.price != null ? `  ·  <span class="price">$${d.price}</span>` : ''}${
      d.fetchOk === false ? `  ·  <span class="fail">${esc(d.fetchNote ?? '수집 실패')}</span>` : ''}</div>
    <div class="tags">${(d.tagNames ?? []).map((t) => `<span>${esc(t)}</span>`).join('')}</div>
  </div>`;

async function render() {
  const tags = [...picked];
  const q = tags.length
    ? query(collection(db, 'products'), where('tagNames', 'array-contains', tags[0]))
    : collection(db, 'products');
  let snap;
  try { snap = await getDocs(q); }
  catch (e) { $('list').innerHTML = `<div class="empty">읽기 실패 — ${esc(e.message)}</div>`; return; }

  const read = snap.size;
  const rows = snap.docs.map((d) => ({ asin: d.id, ...d.data() }))
    .filter((d) => tags.every((t) => (d.tagNames ?? []).includes(t)));

  if (!tags.length) {
    allTags = [...new Set(rows.flatMap((d) => d.tagNames ?? []))].sort();
    $('note').textContent = `docs=${rows.length}  reads=${read}`;
  } else {
    $('note').textContent =
      `where(tagNames array-contains "${tags[0]}") → ${read} docs · client filter ×${tags.length - 1} → ${rows.length} hit · ${read - rows.length} discarded (billed)`;
  }
  $('chips').innerHTML = allTags.map((t) => `<div class="chip${picked.has(t) ? ' on' : ''}" data-t="${esc(t)}">${esc(t)}</div>`).join('');
  $('list').innerHTML = rows.length ? rows.map(row).join('')
    : `<div class="empty">${tags.length ? '0 rows — 이 태그를 모두 가진 제품이 없다' : '0 rows — 아직 등록된 제품이 없다'}</div>`;
}

$('chips').onclick = (e) => {
  const t = e.target.dataset.t; if (!t) return;
  picked.has(t) ? picked.delete(t) : picked.add(t);
  render();
};
$('f').onsubmit = async (e) => {
  e.preventDefault();
  $('btn').disabled = true; $('msg').className = 'msg';
  $('msg').textContent = 'fetching amazon…';
  try {
    const r = await fetch('/api/add', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ asin: $('asin').value, tags: $('tags').value.split(',') }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error ?? '등록 실패');
    $('msg').textContent = j.fetchOk ? `saved — ${j.title ?? j.asin}` : `saved (fetch failed) — ${j.asin}`;
    $('asin').value = ''; $('tags').value = ''; picked.clear(); await render();
  } catch (err) { $('msg').className = 'msg bad'; $('msg').textContent = err.message; }
  $('btn').disabled = false;
};
render();
</script>
</html>
