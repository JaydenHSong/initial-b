<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASIN 스크랩북 — 태그로 걸러 보는 제품 노트</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root { --bg:#fff; --soft:#f4f5f7; --ink:#0f172a; --dim:#64748b; --line:#e2e8f0; --acc:#2563eb; --win:#15803d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); line-height:1.5; padding:0 22px 72px;
    font-family:"Pretendard Variable",-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .w { max-width:1120px; margin:0 auto; }

  /* ── 헤더: 컴팩트하게. 주인공은 목록이다 ── */
  header { padding:26px 0 16px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .k { font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--acc); }
  h1 { font-size:25px; font-weight:800; letter-spacing:-.035em; }
  .lede { font-size:13.5px; font-weight:500; color:var(--dim); }
  .links { margin-left:auto; font-size:13px; font-weight:600; }
  .links a { color:var(--dim); margin-left:14px; text-decoration:none; }
  .links a:hover { color:var(--acc); }

  /* ── 등록: 기본은 접혀 있다. 등록은 가끔이고 보는 게 대부분이다 ── */
  .addbar { display:flex; justify-content:flex-end; margin-bottom:10px; }
  .add { font:inherit; font-size:14px; font-weight:700; padding:9px 18px; border:1.5px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; }
  .add:hover { border-color:var(--acc); color:var(--acc); }
  .add.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  form { display:none; background:var(--soft); border-radius:14px; padding:14px; margin-bottom:18px;
    grid-template-columns:1fr 1.3fr auto; gap:10px; }
  form.open { display:grid; }
  input { font:inherit; font-size:14.5px; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:9px; background:#fff; color:var(--ink); width:100%; }
  input:focus { outline:0; border-color:var(--acc); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .go-btn { font:inherit; font-size:14.5px; font-weight:700; padding:11px 24px; border:0; border-radius:9px;
    background:var(--acc); color:#fff; cursor:pointer; white-space:nowrap; }
  .go-btn:disabled { opacity:.45; cursor:default; }
  .pick { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .pick .lbl { font-size:11.5px; font-weight:700; color:#94a3b8; letter-spacing:.04em; margin-right:2px; }
  .pick button { font:inherit; font-size:11.5px; font-weight:600; padding:3px 9px; border:1px solid var(--line);
    border-radius:6px; background:#fff; color:#475569; cursor:pointer; }
  .pick button:hover { border-color:var(--acc); color:var(--acc); }
  .pick button.used { opacity:.35; }
  .msg { grid-column:1/-1; font-size:13px; font-weight:500; color:var(--dim); }
  .msg.bad { color:#dc2626; }

  /* ── 태그를 축으로 묶는다. 축이 보이면 30개가 돼도 안 무너진다 ── */
  .axes { border-top:1px solid var(--line); padding-top:14px; }
  .axis { display:flex; gap:8px; align-items:flex-start; margin-bottom:7px; }
  .axis > b { flex:0 0 62px; font-size:11.5px; font-weight:700; color:#94a3b8; letter-spacing:.04em; padding-top:7px; }
  .axis .row { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:13.5px; font-weight:600; padding:6px 13px; border:1.5px solid var(--line);
    border-radius:9px; background:#fff; cursor:pointer; color:#334155; user-select:none; }
  .chip:hover { border-color:#cbd5e1; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }

  /* ── 필터 상태줄: 무엇으로 걸러졌고 몇 개가 버려졌나 + 초기화 ── */
  .status { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin:16px 0 14px; font-size:13px; font-weight:500; color:var(--dim); }
  .status .on { color:var(--ink); font-weight:700; }
  .status .clear { font:inherit; font-size:12.5px; font-weight:700; padding:4px 11px; border:1.5px solid var(--line);
    border-radius:7px; background:#fff; color:#475569; cursor:pointer; }
  .status .clear:hover { border-color:#dc2626; color:#dc2626; }
  /* AND / OR — 문서형에서 둘의 처리 방식이 정반대라 나란히 두고 비교한다 */
  .mode { display:inline-flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; }
  .mode button { font:inherit; font-size:12.5px; font-weight:700; padding:5px 12px; border:0;
    background:#fff; color:#64748b; cursor:pointer; }
  .mode button.on { background:var(--ink); color:#fff; }
  .cost { color:#94a3b8; }
  .free { color:var(--win); font-weight:700; }

  /* ── 태그 자동완성: 칩은 태그가 늘면 안 통한다 ── */
  .ac { grid-column:1/-1; position:relative; }
  .ac-list { position:absolute; z-index:5; top:-6px; left:0; right:0; background:#fff;
    border:1.5px solid var(--line); border-radius:10px; box-shadow:0 8px 22px rgba(15,23,42,.10); overflow:hidden; }
  .ac-list button { display:block; width:100%; text-align:left; font:inherit; font-size:13.5px; font-weight:600;
    padding:8px 12px; border:0; background:#fff; color:#334155; cursor:pointer; }
  .ac-list button:hover, .ac-list button.sel { background:var(--soft); color:var(--acc); }

  /* ── 카드: 앞면에 가격 맥락. 카드 클릭은 아마존, 기록은 별도 버튼 ── */
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); }
  .card { perspective:1200px; }
  .inner { position:relative; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.1,.2,1); }
  .card.flip .inner { transform:rotateY(180deg); }
  .face { border:1px solid var(--line); border-radius:14px; background:#fff; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .front { display:flex; flex-direction:column; }
  .card:hover .front { border-color:#cbd5e1; box-shadow:0 4px 14px rgba(15,23,42,.07); }
  .shop { text-decoration:none; color:inherit; display:block; }
  .ph { aspect-ratio:4/3; background:var(--soft); overflow:hidden; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph .none { height:100%; display:grid; place-items:center; font-size:12.5px; font-weight:600; color:#94a3b8; }
  .body { padding:11px 13px 12px; }
  .t { font-size:13px; font-weight:600; color:#334155; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  .pr { font-size:22px; font-weight:800; letter-spacing:-.03em; }
  .ctx { font-size:12px; font-weight:600; color:var(--dim); margin-top:2px; }
  .ctx .gap { color:var(--acc); }
  .ctx .hit { color:var(--win); }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
  .tags i { font-style:normal; font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px;
    background:var(--soft); color:#475569; }
  .tags i.a { background:#eff6ff; color:var(--acc); }
  .more { display:block; width:100%; font:inherit; font-size:12px; font-weight:700; padding:8px;
    border:0; border-top:1px solid var(--line); background:#fff; color:var(--dim); cursor:pointer; }
  .more:hover { background:var(--soft); color:var(--acc); }
  .fail { color:#dc2626; font-size:12.5px; font-weight:600; }

  /* ── 뒷면 ── */
  /* 여는 버튼이 카드 아래에 있으니 닫는 버튼도 같은 자리여야 한다 — 눌렀던 곳을 다시 누른다 */
  .back { position:absolute; inset:0; transform:rotateY(180deg); padding:0;
    display:flex; flex-direction:column; }
  .bk-body { padding:13px; overflow:auto; flex:1; }
  .back .bk-x { margin-top:auto; }
  .bk-h { font-size:12.5px; font-weight:700; color:var(--dim); margin-bottom:9px; }
  .hist { font-size:13px; }
  .hist .sum { font-size:12px; font-weight:700; color:var(--dim); background:var(--soft);
    border-radius:7px; padding:6px 9px; margin-bottom:8px; }
  .hist .r { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); }
  .hist .r.low b { color:var(--acc); }
  .hist em { font-style:normal; font-size:11.5px; font-weight:700; margin-left:6px; }
  .hist em.dn { color:var(--win); }   /* 내렸으면 좋은 일이다 */
  .hist em.up { color:#dc2626; }
  .hist .none { color:#94a3b8; font-size:12px; padding:4px 0; }
  .hist .cost { margin-top:7px; font-size:11.5px; color:#94a3b8; }
  .tg { display:flex; gap:6px; align-items:center; margin-top:11px; }
  .tg label { font-size:12.5px; font-weight:700; color:var(--dim); white-space:nowrap; }
  .tg input { font-size:13.5px; padding:7px 9px; min-width:0; }
  .tg .save { font:inherit; font-size:12.5px; font-weight:700; padding:7px 13px; border:0; border-radius:8px;
    background:var(--acc); color:#fff; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .tg-msg { font-size:12px; color:var(--dim); margin-top:6px; min-height:1em; }
  .tg-msg.bad { color:#dc2626; }

  .empty { grid-column:1/-1; color:var(--dim); font-size:14.5px; font-weight:500; padding:52px 0; text-align:center; }
  @media (max-width:620px) {
    form { grid-template-columns:1fr; }
    header { gap:8px; } .links { margin-left:0; width:100%; }
    .axis { flex-direction:column; gap:4px; } .axis > b { padding-top:0; }
  }
</style>

<div class="w">
  <header>
    <div>
      <div class="k">S02 · 데이터 저장</div>
      <h1>ASIN 스크랩북</h1>
    </div>
    <div class="lede">태그로 좁혀 보고, 목표가를 걸어 매일 지켜본다</div>
    <div class="links"><a href="/docs/plan.html">기획서 ↗</a><a href="/docs/report.html">리포트 ↗</a></div>
  </header>

  <div class="addbar"><button class="add" id="toggle" type="button">+ 제품 추가</button></div>

  <form id="f">
    <input id="asin" placeholder="ASIN 또는 아마존 상품 URL" autocomplete="off" required>
    <input id="tags" placeholder="태그 쉼표로 — 방열, 5만원대" autocomplete="off" required>
    <button class="go-btn" id="btn">등록</button>
    <div class="ac"><div id="ac"></div></div>
    <div class="pick" id="pick"></div>
    <div class="msg" id="msg"></div>
  </form>

  <div class="axes" id="axes"></div>
  <div class="status" id="status"></div>
  <div class="grid" id="list"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, collection, getDocs, query, where }
  from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

// 이 config는 공개되어도 되는 값이다. 실제 방어는 Firestore 보안 규칙(읽기 공개·쓰기 거부)이 한다.
const db = getFirestore(initializeApp({
  apiKey: 'AIzaSyAYS4Os_XoJUyGRYBrN3Pmb5mDm4dox0b4',
  authDomain: 'initial-b.firebaseapp.com',
  projectId: 'initial-b',
  storageBucket: 'initial-b.firebasestorage.app',
  messagingSenderId: '678214115027',
  appId: '1:678214115027:web:c8fd3d32846d4c24483e26',
}));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 아마존 이미지 URL은 크기 토큰을 갈아끼울 수 있다 — 원본 1500px을 500px로 줄여 받는다.
const small = (u) => u.replace(/\._[A-Z0-9_,]+_\./, '._SL500_.');
const money = (n) => '$' + Number(n).toFixed(2);
const isAuto = (d, t) => (d.autoTags ?? (d.autoTag ? [d.autoTag] : [])).includes(t);

const picked = new Set();
let rowsAll = [];   // 필터 없이 읽은 전체 — 축을 만드는 근거
let mode = 'AND';   // AND: 서버가 못 좁혀서 클라이언트가 버린다 / OR: 서버가 한 방에 준다

// 날짜를 사람이 읽는 말로. 기록이 여러 줄 쌓이면 2026-08-12 보다 "3일 전"이 빠르다.
const relDay = (iso) => {
  const d = Math.round((Date.parse(new Date().toISOString().slice(0, 10)) - Date.parse(iso)) / 86400000);
  return d <= 0 ? '오늘' : d === 1 ? '어제' : `${d}일 전`;
};

// 태그를 세 축으로 가른다. 가격대는 $로 시작하고, 카테고리는 자동으로 붙은 나머지, 그 외는 내 분류다.
function axesOf(rows) {
  const mine = new Set(), cat = new Set(), band = new Set();
  for (const d of rows) for (const t of d.tagNames ?? []) {
    if (/^\$/.test(t)) band.add(t);
    else if (isAuto(d, t)) cat.add(t);
    else mine.add(t);
  }
  const srt = (s) => [...s].sort();
  return { 내: srt(mine), 카테고리: srt(cat), 가격대: srt(band) };
}

// 앞면 가격 맥락 — 숫자 하나가 아니라 최저가·목표가와의 관계를 보여준다.
function ctxOf(d) {
  if (d.price == null) return `<div class="fail">${esc(d.fetchNote ?? '가격 없음')}</div>`;
  const bits = [];
  if (d.minPrice != null) bits.push(d.minPrice >= d.price ? '지금이 최저' : `최저 ${money(d.minPrice)}`);
  if (d.targetPrice != null) {
    bits.push(d.price <= d.targetPrice
      ? `<span class="hit">목표 ${money(d.targetPrice)} 도달</span>`
      : `목표까지 <span class="gap">${money(d.price - d.targetPrice)}</span>`);
  }
  return `<div class="ctx">${bits.join(' · ') || '&nbsp;'}</div>`;
}

const row = (d) => `
  <div class="card" data-asin="${esc(d.asin)}">
   <div class="inner">
    <div class="face front">
      <a class="shop" href="https://www.amazon.com/dp/${esc(d.asin)}" target="_blank" rel="noopener noreferrer">
        <div class="ph">${d.image ? `<img src="${esc(small(d.image))}" alt="" loading="lazy">` : `<div class="none">사진 없음</div>`}</div>
        <div class="body">
          <div class="t">${d.title ? esc(d.title) : `<span class="fail">제목 수집 실패</span>`}</div>
          ${d.price != null ? `<div class="pr">${money(d.price)}</div>` : ''}
          ${ctxOf(d)}
          <div class="tags">${(d.tagNames ?? []).map((t) =>
            `<i class="${isAuto(d, t) ? 'a' : ''}">${esc(t)}</i>`).join('')}</div>
        </div>
      </a>
      <button class="more" type="button">가격 기록 · 목표가 ↻</button>
    </div>
    <div class="face back">
      <div class="bk-body">
        <div class="bk-h">가격 기록</div>
        <div class="hist">불러오는 중…</div>
        <div class="tg">
          <label>목표가</label>
          <input type="number" step="0.01" min="0" placeholder="예: 59.99" value="${d.targetPrice ?? ''}">
          <button class="save" type="button">저장</button>
        </div>
        <div class="tg-msg"></div>
      </div>
      <button class="more bk-x" type="button">↩ 닫기</button>
    </div>
   </div>
  </div>`;

// ── 등록 폼 접기/펼치기 ──
$('toggle').onclick = () => {
  const open = $('f').classList.toggle('open');
  $('toggle').classList.toggle('on', open);
  $('toggle').textContent = open ? '− 닫기' : '+ 제품 추가';
  if (open) $('asin').focus();
};

// 기존 태그를 눌러 넣는다. 손으로 다시 치면 오타가 나고, 오타 난 태그는 AND 필터에서 조용히 빠진다.
function renderPick() {
  const typed = new Set($('tags').value.split(',').map((s) => s.trim()).filter(Boolean));
  const mine = axesOf(rowsAll).내;
  $('pick').innerHTML = mine.length
    ? `<span class="lbl">내 태그</span>` + mine
        .map((t) => `<button type="button" class="${typed.has(t) ? 'used' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')
    : '';
}
$('pick').onclick = (e) => {
  const t = e.target.dataset?.t;
  if (!t) return;
  const cur = $('tags').value.split(',').map((s) => s.trim()).filter(Boolean);
  $('tags').value = (cur.includes(t) ? cur.filter((x) => x !== t) : [...cur, t]).join(', ');
  renderPick();
};
// 자동완성 — 쉼표 뒤 마지막 토막만 보고 기존 태그를 제안한다.
// 칩 클릭으로도 넣을 수 있지만 태그가 늘면 칩 줄이 길어져 못 쓴다.
let acHit = [];
function renderAc() {
  const raw = $('tags').value;
  const last = raw.split(',').pop().trim();
  const already = new Set(raw.split(',').map((s) => s.trim()).filter(Boolean));
  acHit = !last ? [] : [...new Set(rowsAll.flatMap((d) => d.tagNames ?? []))]
    .filter((t) => !already.has(t) && t.toLowerCase().includes(last.toLowerCase()))
    .sort().slice(0, 6);
  $('ac').innerHTML = acHit.length
    ? `<div class="ac-list">${acHit.map((t, i) =>
        `<button type="button" data-ac="${esc(t)}" class="${i === 0 ? 'sel' : ''}">${esc(t)}</button>`).join('')}</div>`
    : '';
}
function applyAc(tag) {
  const parts = $('tags').value.split(',');
  parts[parts.length - 1] = ` ${tag}`;
  $('tags').value = parts.join(',').replace(/^\s+/, '') + ', ';
  $('ac').innerHTML = '';
  acHit = [];
  $('tags').focus();
  renderPick();
}
$('ac').onclick = (e) => { const t = e.target.dataset?.ac; if (t) applyAc(t); };
$('tags').oninput = () => { renderPick(); renderAc(); };
$('tags').onkeydown = (e) => {
  if (e.key === 'Tab' && acHit.length) { e.preventDefault(); applyAc(acHit[0]); }
  if (e.key === 'Escape') { $('ac').innerHTML = ''; acHit = []; }
};
$('tags').onblur = () => setTimeout(() => { $('ac').innerHTML = ''; acHit = []; }, 150);

async function render() {
  const tags = [...picked];
  // 같은 저장소인데 AND와 OR의 처리 방식이 정반대다 — 이게 이번 주에 본 것이다.
  //  AND: array-contains 가 질의당 하나뿐이고 array-contains-all 이 없다.
  //       첫 태그로만 서버에서 좁히고 나머지는 여기서 버린다. 버린 문서도 읽기 요금.
  //  OR : array-contains-any 가 최대 30개를 한 번에 받는다. 서버가 정확히 답하고 버릴 게 없다.
  const q = !tags.length ? collection(db, 'products')
    : mode === 'OR'
      ? query(collection(db, 'products'), where('tagNames', 'array-contains-any', tags.slice(0, 30)))
      : query(collection(db, 'products'), where('tagNames', 'array-contains', tags[0]));

  let snap;
  try { snap = await getDocs(q); }
  catch (e) { $('list').innerHTML = `<div class="empty">읽기 실패 — ${esc(e.message)}</div>`; return; }

  const read = snap.size;
  const got = snap.docs.map((d) => ({ asin: d.id, ...d.data() }));
  // OR은 서버가 이미 정확히 답했다. AND만 여기서 더 걸러낸다.
  const rows = mode === 'OR' ? got : got.filter((d) => tags.every((t) => (d.tagNames ?? []).includes(t)));
  if (!tags.length) rowsAll = rows;

  // 축
  const ax = axesOf(rowsAll);
  $('axes').innerHTML = Object.entries(ax).filter(([, v]) => v.length).map(([name, list]) =>
    `<div class="axis"><b>${name}</b><div class="row">${list
      .map((t) => `<div class="chip${picked.has(t) ? ' on' : ''}" data-t="${esc(t)}">${esc(t)}</div>`).join('')}</div></div>`).join('');

  // 상태줄 — 무엇으로 걸렀고 몇 개를 버렸나. 버린 수가 이번 주 리포트의 핵심이다.
  const toggle = `<span class="mode">`
    + `<button type="button" data-m="AND" class="${mode === 'AND' ? 'on' : ''}">모두 (AND)</button>`
    + `<button type="button" data-m="OR" class="${mode === 'OR' ? 'on' : ''}">하나라도 (OR)</button></span>`;
  $('status').innerHTML = tags.length
    ? toggle
      + `<span><span class="on">${tags.map(esc).join(mode === 'OR' ? ' 또는 ' : ' + ')}</span> — 전체 ${rowsAll.length}개 중 <span class="on">${rows.length}개</span></span>`
      + (mode === 'OR'
        ? `<span class="free">· 서버가 ${read}개를 정확히 돌려줬다 — 버린 것 0 (array-contains-any)</span>`
        : `<span class="cost">· 서버가 ${read}개를 돌려주고 ${read - rows.length}개를 버렸다 — 버린 것도 읽기 요금</span>`)
      + `<button class="clear" id="clear" type="button">초기화</button>`
    : toggle + `<span>제품 ${rows.length}개 · 문서 ${read}회 읽음</span>`;
  const cl = $('clear');
  if (cl) cl.onclick = () => { picked.clear(); render(); };
  $('status').querySelectorAll('.mode button').forEach((b) => {
    b.onclick = () => { mode = b.dataset.m; render(); };
  });

  $('list').innerHTML = rows.length
    ? rows.map(row).join('')
    : `<div class="empty">${tags.length ? '이 태그를 모두 가진 제품이 없다' : '아직 등록된 제품이 없다. 위 「+ 제품 추가」로 시작해라.'}</div>`;
  renderPick();
}

$('axes').onclick = (e) => {
  const t = e.target.dataset.t;
  if (!t) return;
  picked.has(t) ? picked.delete(t) : picked.add(t);
  render();
};

// 카드 클릭은 아마존으로 간다(자연스러운 동작). 기록은 별도 버튼으로만 뒤집는다.
$('list').onclick = async (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const asin = card.dataset.asin;

  if (e.target.closest('.save')) {
    const inp = card.querySelector('.tg input');
    const msg = card.querySelector('.tg-msg');
    msg.className = 'tg-msg';
    msg.textContent = '저장 중…';
    try {
      const r = await fetch('/api/target', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ asin, target: inp.value === '' ? null : inp.value }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? '저장 실패');
      msg.textContent = j.targetPrice == null ? '목표가를 지웠다'
        : j.alreadyBelow ? `저장됨 — 지금 ${money(j.price)}로 이미 목표 아래다`
        : `저장됨 — 다음 수집부터 감시한다`;
      // 앞면 맥락줄을 그 자리에서 갱신한다. 전체를 다시 그리면 뒤집힌 카드가 닫혀버린다.
      const d = rowsAll.find((x) => x.asin === asin) ?? {};
      d.targetPrice = j.targetPrice;
      const ctx = card.querySelector('.front .ctx, .front .fail');
      if (ctx) ctx.outerHTML = ctxOf({ ...d, price: j.price ?? d.price });
    } catch (err) {
      msg.className = 'tg-msg bad';
      msg.textContent = err.message;
    }
    return;
  }

  if (!e.target.closest('.more') && !e.target.closest('.bk-x')) return;  // 나머지는 링크가 처리
  card.classList.toggle('flip');
  if (!card.classList.contains('flip')) return;

  const box = card.querySelector('.hist');
  if (box.dataset.loaded) return;
  const t0 = performance.now();
  try {
    const snap = await getDocs(collection(db, 'products', asin, 'prices'));
    const pts = snap.docs.map((p) => ({ at: p.id, ...p.data() })).sort((a, b) => (a.at < b.at ? 1 : -1));
    const vals = pts.map((p) => p.price);
    const min = pts.length ? Math.min(...vals) : null;
    const max = pts.length ? Math.max(...vals) : null;
    // 요약 한 줄 — 줄이 늘어날수록 목록만 봐서는 폭이 안 보인다.
    const sum = pts.length > 1
      ? `<div class="sum">${pts.length}일치 · ${money(min)} ~ ${money(max)}${pts[0].price === min ? ' · 지금이 최저' : ''}</div>`
      : '';
    box.innerHTML = pts.length
      ? sum + pts.map((p, i) => {
          // pts 는 최신순이라 다음 항목이 그 전날이다.
          const dv = pts[i + 1] ? p.price - pts[i + 1].price : null;
          const delta = dv == null || Math.abs(dv) < 0.005 ? ''
            : `<em class="${dv < 0 ? 'dn' : 'up'}">${dv < 0 ? '▼' : '▲'}${money(Math.abs(dv)).slice(1)}</em>`;
          return `<div class="r${p.price === min ? ' low' : ''}"><span>${relDay(p.at)}</span><b>${money(p.price)}${delta}</b></div>`;
        }).join('')
        + (pts.length === 1 ? `<div class="none">크론이 하루 한 번 한 줄씩 쌓는다.</div>` : '')
        + `<div class="cost">이 카드 하나에 문서 ${snap.size}회 읽음 · ${Math.round(performance.now() - t0)}ms</div>`
      : `<div class="none">아직 기록이 없다. 크론이 하루 한 번 쌓는다.</div>`;
    box.dataset.loaded = '1';
  } catch (err) {
    box.innerHTML = `<div class="none">읽기 실패 — ${esc(err.message)}</div>`;
  }
};

$('f').onsubmit = async (e) => {
  e.preventDefault();
  $('btn').disabled = true;
  $('msg').className = 'msg';
  $('msg').textContent = '아마존에서 제목·가격·사진을 가져오는 중… (1~2초)';
  try {
    const r = await fetch('/api/add', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ asin: $('asin').value, tags: $('tags').value.split(',') }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error ?? '등록 실패');
    $('msg').textContent = j.fetchOk
      ? `저장됨 — ${j.title ?? j.asin}${j.autoTags?.length ? ` · 자동 태그 ${j.autoTags.map((t) => `«${t}»`).join(' ')}` : ''}`
      : `저장됨 (수집은 실패) — ${j.asin}`;
    $('asin').value = ''; $('tags').value = '';
    picked.clear();
    await render();
  } catch (err) {
    $('msg').className = 'msg bad';
    $('msg').textContent = err.message;
  }
  $('btn').disabled = false;
};

render();
</script>
</html>
