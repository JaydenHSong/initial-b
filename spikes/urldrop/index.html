const SUPA = 'https://mathlgugjqnnhsexvqjy.supabase.co';
const KEY = 'sb_publishable_ZYCrRbAghMXoB_dUKG1X1g_TkhCDJYA';
fetch(`${SUPA}/rest/v1/s01_spike_sites?select=*&order=id.desc`, {
