<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경쟁사 가격 수집기</title>
<style>
  :root { --paper:#fafaf8; --card:#fff; --ink:#1b1e24; --dim:#70747e; --line:#e3e2dc; --acc:#159a6c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--paper); color:var(--ink); line-height:1.6; padding:0 20px 60px;
    font-family:-apple-system, "Pretendard Variable", sans-serif; }
  .wrap { max-width:860px; margin:0 auto; }
  header { padding:34px 0 6px; }
  h1 { font-size:24px; letter-spacing:-.02em; }
  .sub { color:var(--dim); font-size:14px; margin:4px 0 20px; }
  form { display:flex; gap:8px; margin-bottom:8px; }
  input { flex:1; font-size:15px; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); min-width:0; }
  button { font-size:15px; padding:11px 20px; border:0; border-radius:10px; background:var(--ink);
    color:#fff; cursor:pointer; white-space:nowrap; }
  #msg { min-height:22px; font-size:13px; color:#c0392b; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(255px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .thumb { width:100%; height:132px; object-fit:contain; margin-bottom:12px; }
  .title { font-size:13.5px; line-height:1.45; margin-bottom:10px; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:39px; }
  .rating { font-size:12.5px; color:var(--dim); margin-top:3px; }
  .rating b { color:#b26a00; font-weight:600; }
  .price { font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .price .none { font-size:14px; font-weight:400; color:var(--dim); }
  .meta { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .badge { font-size:11.5px; padding:2px 9px; border-radius:99px; font-weight:600; }
  .st-pending { background:#fff3e0; color:#b26a00; animation:pulse 1.2s infinite; }
  .st-ok { background:#e5f6ef; color:#0e7a55; }
  .st-blocked { background:#fdecea; color:#b03a2e; }
  .st-failed { background:#eceff1; color:#546e7a; }
  @keyframes pulse { 50% { opacity:.45; } }
  .note { font-size:11.5px; color:var(--dim); margin-top:8px; word-break:break-word; }
  .card a { color:var(--dim); font-size:12px; text-decoration:none; }
  .card a:hover { color:var(--acc); }
  .empty { color:var(--dim); font-size:14px; padding:30px 0; }
</style>

<div class="wrap">
  <header>
    <h1>경쟁사 가격 수집기</h1>
    <p class="sub">아마존 상품 URL을 드랍하면 <b>등록은 즉시</b>, 가격은 백그라운드 수집이 채운다. 다시 긁기 = 같은 URL 재드랍.</p>
  </header>
  <form id="f">
    <input id="u" placeholder="https://www.amazon.com/dp/…" required autocomplete="off">
    <button>드랍</button>
  </form>
  <div id="msg"></div>
  <div class="cards" id="cards"><div class="empty">등록된 상품이 없다. URL을 드랍하면 첫 카드가 생긴다.</div></div>
</div>

<script>
const SUPA = 'https://mathlgugjqnnhsexvqjy.supabase.co';
const ANON = 'sb_publishable_ZYCrRbAghMXoB_dUKG1X1g_TkhCDJYA'; // 읽기 전용 — 쓰기는 RLS가 막는다
const LABEL = { pending:['수집 중','st-pending'], ok:['성공','st-ok'], blocked:['차단됨','st-blocked'], failed:['실패','st-failed'] };
const $ = (id) => document.getElementById(id);

function card(r) {
  const el = document.createElement('div');
  el.className = 'card';
  const [label, cls] = LABEL[r.status] ?? [r.status, 'st-failed'];
  if (r.image?.startsWith('https://m.media-amazon.com/')) {
    const img = document.createElement('img');
    img.className = 'thumb'; img.src = r.image; img.alt = ''; img.loading = 'lazy';
    el.appendChild(img);
  }
  const t = document.createElement('div'); t.className = 'title'; t.textContent = r.title ?? r.asin;
  const p = document.createElement('div'); p.className = 'price';
  p.innerHTML = r.price != null ? '$' + Number(r.price).toFixed(2) : '<span class="none">가격 없음</span>';
  const m = document.createElement('div'); m.className = 'meta';
  m.innerHTML = `<span class="badge ${cls}">${label}</span>`;
  if (r.checked_at) {
    const at = new Date(r.checked_at);
    m.innerHTML += `<span>${at.toLocaleDateString('ko', {month:'numeric',day:'numeric'})} ${at.toLocaleTimeString('ko', {hour:'2-digit',minute:'2-digit'})}${r.via === 'proxy' ? ' · 프록시' : ''}</span>`;
  }
  const link = document.createElement('a'); link.href = r.url; link.target = '_blank'; link.rel = 'noreferrer';
  link.textContent = '아마존 ↗'; m.appendChild(link);
  el.append(t, p);
  if (r.rating) {
    const rt = document.createElement('div'); rt.className = 'rating';
    rt.innerHTML = `<b>★ ${Number(r.rating).toFixed(1)}</b>` + (r.reviews ? ` · 리뷰 ${Number(r.reviews).toLocaleString()}` : '');
    el.appendChild(rt);
  }
  el.append(m);
  if (r.note && r.status !== 'ok' && r.status !== 'pending') {
    const n = document.createElement('div'); n.className = 'note'; n.textContent = r.note; el.appendChild(n);
  }
  return el;
}

async function load() {
  const r = await fetch(`${SUPA}/rest/v1/s04_products?select=*&order=created_at.desc`, { headers: { apikey: ANON } });
  if (!r.ok) return;
  const rows = await r.json();
  const box = $('cards');
  box.replaceChildren(...rows.map(card));
  if (!rows.length) box.innerHTML = '<div class="empty">등록된 상품이 없다. URL을 드랍하면 첫 카드가 생긴다.</div>';
}

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/drop', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ url: $('u').value.trim() }),
  });
  const j = await r.json().catch(() => ({}));
  $('msg').textContent = r.ok ? '' : (j.error ?? `등록 실패 (${r.status})`);
  if (r.ok) { $('u').value = ''; load(); }
};

// 화면 반영은 폴링 — 실시간 구독은 폴링이 모자랄 때만 (이번 주엔 충분하다).
// document.hidden 게이트를 걸었다가 뺐다: 임베디드 뷰가 hidden=true로 고정돼
// 폴링이 통째로 죽는다. 행 몇 개 3초 폴링은 아낄 비용이 아니다.
setInterval(load, 3000);
load();
</script>
</html>
